# Deploys the static site to GitHub Pages.
# Needs Settings > Pages > Build and deployment > Source = "GitHub Actions".
# (With "Deploy from a branch" GitHub publishes the whole repo, including research/, and ignores this file.)
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job: copy the public files into _site and upload them as the Pages artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site (leave out dev-only files)
        run: |
          mkdir _site
          rsync -a \
            --exclude '/_site' --exclude '/.git' --exclude '/.github' \
            --exclude '/research' --exclude '/.gitattributes' --exclude '/.gitignore' \
            --exclude '/index-b.html' \
            --exclude '/css' --exclude '/fonts/fonts.css' \
            --include '/js/*.min.js' --exclude '/js/*.js' \
            ./ _site/
          echo "Files in the artifact:"
          find _site -type f | sort | head -100
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  # Deploy job: runs on a fresh runner after the artifact is fully uploaded
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
